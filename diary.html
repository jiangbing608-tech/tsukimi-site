<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>日記 | 月見の庭</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

background:#eee8dc;

color:#37342f;

font-family:
"Yu Mincho",
"Hiragino Mincho ProN",
"Noto Serif JP",
serif;

}



.page{

max-width:800px;

min-height:100vh;

margin:auto;

padding:60px 35px;

background:#f8f3e8;

}



.back{

display:block;

text-decoration:none;

color:#596270;

letter-spacing:3px;

margin-bottom:50px;

}




.moon{

text-align:center;

font-size:50px;

color:#596270;

}



h1{

text-align:center;

font-size:34px;

font-weight:normal;

letter-spacing:8px;

}



.date{

text-align:center;

color:#777;

letter-spacing:3px;

margin-bottom:50px;

}





.record{

background:#fbf7ee;

border:1px solid #ddd4c4;

padding:35px;

margin-bottom:30px;

box-shadow:
3px 5px 10px rgba(70,60,50,.08);

}



.record h2{

font-size:20px;

font-weight:normal;

letter-spacing:4px;

color:#596270;

margin-top:0;

}



.record p{

line-height:2;

color:#59554e;

}

  
textarea{

width:100%;

height:180px;

padding:20px;

background:#fffaf0;

border:1px solid #ddd4c4;

font-family:
"Yu Mincho",
serif;

font-size:15px;

line-height:2;

resize:none;

color:#59554e;

}


.music a{

color:#596270;

text-decoration:none;

}





.photo{

height:180px;

background:#eee5d8;

display:flex;

justify-content:center;

align-items:center;

color:#999;

}




footer{

text-align:center;

margin-top:60px;

font-size:13px;

color:#777;

letter-spacing:3px;

}


/* 保存按钮 */

button{

display:block;

margin:40px auto;

padding:12px 35px;

background:#596270;

color:white;

border:none;

font-family:
"Yu Mincho",
serif;

letter-spacing:4px;

cursor:pointer;

}


button:hover{

opacity:.8;

}



</style>


</head>



<body>


<div class="page">


<a href="calendar.html" class="back">
☾ 月の記録室へ戻る
</a>



<div class="moon">
☾
</div>


<h1>
今日の日記
</h1>


<div class="date" id="date">

</div>



<section class="record">


<h2>
📖 日記
</h2>


<textarea id="diary-text"
placeholder="今天发生了什么？&#10;&#10;写一点生活，写一点想法，写一点月光。">
</textarea>


</section>



<section class="record music">


<h2>
🎵 音楽
</h2>


<p>
今日聴いた曲：
</p>


<input 
id="music"
placeholder="歌曲名字">


<input 
id="music-link"
placeholder="网易云音乐链接">


</section>





<section class="record">


<h2>
📷 写真
</h2>


<div class="photo">

以后放照片

</div>


</section>





<section class="record">


<h2>
🇯🇵 日本語
</h2>


<textarea 
id="japanese-text"
placeholder="今日の日本語">
</textarea>


</section>

<button id="save">

🌙 保存する

</button>


<footer>

「思い出は月のように。」

<br>

— 月見

</footer>



</div>





<script>


const params =
new URLSearchParams(
window.location.search
);


const date =
params.get("date");



if(date){

document.getElementById("date").textContent =
date;

}else{


const today =
new Date();


document.getElementById("date").textContent =
`${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;


}

const diary =
document.getElementById("diary-text");

const music =
document.getElementById("music");

const musicLink =
document.getElementById("music-link");

const japanese =
document.getElementById("japanese-text");



const saved =
JSON.parse(
localStorage.getItem("moonDiary")
);



if(saved){

diary.value =
saved.diary || "";


music.value =
saved.music || "";


musicLink.value =
saved.musicLink || "";


japanese.value =
saved.japanese || "";

}




document.getElementById("save")
.onclick=function(){


const data={


diary:diary.value,

music:music.value,

musicLink:musicLink.value,

japanese:japanese.value


};



localStorage.setItem(
"moonDiary",
JSON.stringify(data)
);



alert("月の記録を保存しました。🌙");


};
  
</script>


</body>

</html>
