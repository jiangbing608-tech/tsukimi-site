.back{

}

.date{

}




.music a{

}





.photo{

height:180px;

background:#eee5d8;

display:flex;

justify-content:center;

align-items:center;

}




footer{

margin-top:60px;

</div>





<script>


const params =
new URLSearchParams(
window.location.search
);


const date =
params.get("date");



if(date){

document.getElementById("date").textContent =
date;

}else{


const today =
new Date();


document.getElementById("date").textContent =
`${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;


}


</script>
