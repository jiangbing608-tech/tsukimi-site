<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>日記 | 月見の庭</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

background:#eee8dc;

color:#37342f;

font-family:
"Yu Mincho",
"Hiragino Mincho ProN",
"Noto Serif JP",
serif;

}



.page{

max-width:800px;

min-height:100vh;

margin:auto;

padding:60px 35px;

background:#f8f3e8;

}



.back{

display:block;

text-decoration:none;

color:#596270;

letter-spacing:3px;

margin-bottom:50px;

}




.moon{

text-align:center;

font-size:50px;

color:#596270;

}



h1{

text-align:center;

font-size:34px;

font-weight:normal;

letter-spacing:8px;

}



.date{

text-align:center;

color:#777;

letter-spacing:3px;

margin-bottom:50px;

}





.record{

background:#fbf7ee;

border:1px solid #ddd4c4;

padding:35px;

margin-bottom:30px;

box-shadow:
3px 5px 10px rgba(70,60,50,.08);

}



.record h2{

font-size:20px;

font-weight:normal;

letter-spacing:4px;

color:#596270;

margin-top:0;

}



.record p{

line-height:2;

color:#59554e;

}

  
textarea{

width:100%;

height:180px;

padding:20px;

background:#fffaf0;

border:1px solid #ddd4c4;

font-family:
"Yu Mincho",
serif;

font-size:15px;

line-height:2;

resize:none;

color:#59554e;

}


.music a{

color:#596270;

text-decoration:none;

}

#music-link-view{

display:inline-block;

margin-top:15px;

padding:8px 18px;

border:1px solid #596270;

letter-spacing:2px;

font-size:14px;

}



.photo{

height:180px;

background:#eee5d8;

display:flex;

justify-content:center;

align-items:center;

color:#999;

}




footer{

text-align:center;

margin-top:60px;

font-size:13px;

color:#777;

letter-spacing:3px;

}


/* 保存按钮 */

button{

display:block;

margin:40px auto;

padding:12px 35px;

background:#596270;

color:white;

border:none;

font-family:
"Yu Mincho",
serif;

letter-spacing:4px;

cursor:pointer;

}


button:hover{

opacity:.8;

}



</style>


</head>



<body>


<div class="page">


<a href="calendar.html" class="back">
☾ 月の記録室へ戻る
</a>



<div class="moon">
☾
</div>


<h1 id="title">
今日の日記
</h1>


<div class="date" id="date">

</div>



<section class="record">


<h2>
📖 日記
</h2>


<p id="diary-content">
</p>

</section>



<section class="record music">


<h2>
🎵 音楽
</h2>


<p>
今日聴いた曲：
</p>


<p id="music-content">
</p>

<a 
id="music-link-view"
target="_blank"
style="display:none;">
🎧 聴く
</a>
  
</section>





<section class="record">


<h2>
📷 写真
</h2>


<div class="photo" id="photo-content">

暂无照片

</div>


</section>





<section class="record">


<h2>
🇯🇵 日本語
</h2>

<p id="japanese-content">
</p>

</section>

<footer>

「思い出は月のように。」

<br>

— 月見

</footer>



</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
<script>

const SUPABASE_URL =
"https://cnmsctwltdmfkgfhysqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_sxexZUH4aIZ0F6p3WwMY2Q_4JagOL24";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



const diaryContent =
document.getElementById("diary-content");


const musicContent =
document.getElementById("music-content");

const musicLinkView =
document.getElementById("music-link-view");
  
const japaneseContent =
document.getElementById("japanese-content");

const photoContent =
document.getElementById("photo-content");

const params =
new URLSearchParams(
window.location.search
);



const date =
params.get("date");



const today =
new Date();


const todayString =
`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;



const targetDate =
date || todayString;



if(targetDate !== todayString){

document.getElementById("title").textContent =
`${targetDate}の日記`;

}



document.getElementById("date").textContent =
targetDate;




async function loadDiary(){


const {data,error}=

await supabaseClient

.from("diary")

.select("*")

.eq("date",targetDate)

.maybeSingle();



/*
今天：
没有记录 → 保持空白

过去：
没有记录 → 显示暂无记录
*/


if(error || !data){


if(targetDate !== todayString){


diaryContent.textContent =
"暂无记录";


musicContent.textContent =
"暂无记录";

if(data.music_link){

musicLinkView.href =
data.music_link;

musicLinkView.style.display =
"inline-block";

}
  
japaneseContent.textContent =
"暂无记录";


}


return;

}




diaryContent.textContent =
data.content || "暂无记录";


musicContent.textContent =
data.music || "";

japaneseContent.textContent =
data.japanese || "暂无记录";

photoContent.textContent =
data.photo || "暂无照片";

}


loadDiary();
</script>

</body>

</html>
