<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>月見の庭</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eee8dc;
            color: #37342f;
            font-family: "Yu Mincho", "Hiragino Mincho ProN",
                         "Noto Serif JP", serif;
        }

        /* 整本手帐 */
.notebook {

    position:relative;

    max-width:900px;

    min-height:100vh;

    margin:0 auto;

    padding:70px 45px;


    background:
    linear-gradient(
        rgba(255,255,255,0.25),
        rgba(255,255,255,0.25)
    ),
    #f8f3e8;


    box-shadow:    
    0 0 40px rgba(70,60,50,0.08);


    overflow:hidden;

}
        /* 月相装饰 */
       .moon-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-bottom: 45px;
    opacity: 0.65;
}

.moon-phase {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-block;
    background: #596270;
}

/* 新月 */
.moon-phase.new {
    background: transparent;
    border: 1px solid #596270;
}

/* 右弦月 */
.moon-phase.crescent-right {
    background: #596270;
    box-shadow: inset -7px 0 0 #f8f3e8;
}

/* 右半月 */
.moon-phase.quarter-right {
    background: linear-gradient(
        to right,
        #596270 50%,
        #f8f3e8 50%
    );
}

/* 右凸月 */
.moon-phase.gibbous-right {
    background: linear-gradient(
        to right,
        #596270 70%,
        #f8f3e8 70%
    );
}

/* 满月 */
.moon-phase.full {
    background: #596270;
}

/* 左凸月 */
.moon-phase.gibbous-left {
    background: linear-gradient(
        to left,
        #596270 70%,
        #f8f3e8 70%
    );
}

/* 左半月 */
.moon-phase.quarter-left {
    background: linear-gradient(
        to left,
        #596270 50%,
        #f8f3e8 50%
    );
}

/* 左弦月 */
.moon-phase.crescent-left {
    background: #596270;
    box-shadow: inset 7px 0 0 #f8f3e8;
}

  /* 小鸟居装饰 */

.torii {
    width: 70px;
    height: 70px;
    margin: 0 auto 20px;
    position: relative;
    opacity: 0.35;
}

/* 鸟居顶部 */

.torii-top {
    position: absolute;
    top: 8px;
    left: 5px;
    width: 60px;
    height: 8px;
    border-top: 3px solid #8b3a32;
    border-bottom: 3px solid #8b3a32;
}


/* 鸟居柱子 */

.torii-body {
    position: absolute;
    bottom: 5px;
    left: 18px;
    width: 34px;
    height: 45px;
    border-left: 3px solid #8b3a32;
    border-right: 3px solid #8b3a32;
}      
        
        /* 网站标题 */
        .title {
            text-align: center;
            margin-bottom: 55px;
        }

        .title .moon {
            font-size: 42px;
            color: #596270;
            margin-bottom: 12px;
        }

        .title h1 {
            margin: 0;
            font-size: 42px;
            font-weight: normal;
            letter-spacing: 8px;
        }

        .title p {
            margin-top: 18px;
            font-size: 13px;
            letter-spacing: 4px;
            color: #777269;
        }

        /* 日期 */
        .date {
            text-align: center;
            margin-bottom: 30px;
            color: #777269;
            letter-spacing: 2px;
        }

        /* 今日记录 */
        .diary {
            position: relative;
            max-width: 650px;
            margin: 0 auto 55px;
            padding: 40px;
            background: #fbf7ee;
            border: 1px solid #ddd4c4;
            box-shadow: 4px 5px 0 rgba(100, 90, 75, 0.08);
        }

        .diary h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: normal;
            letter-spacing: 4px;
        }

        .diary p {
            line-height: 2;
            color: #59554e;
        }

.diary textarea {

    width:100%;
    min-height:160px;

    padding:20px;

    background:#fffaf0;

    border:1px solid #ddd4c4;

    font-family:inherit;

    font-size:15px;

    line-height:2;

    resize:none;

}


.diary input {

    width:100%;

    margin-top:20px;

    padding:12px;

    border:1px solid #ddd4c4;

    background:#fffaf0;

    font-family:inherit;

}



.diary button {

    margin-top:25px;

    padding:12px 40px;

    background:#596270;

    color:white;

    border:none;

    cursor:pointer;

    letter-spacing:3px;

}
        
        /* 四个入口 */
        .sections {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            max-width: 650px;
            margin: 0 auto 65px;
        }
        
.section {

    padding: 32px 25px;

    background: #fbf7ee;

    border: 1px solid #ddd4c4;

    text-align:center;

    text-decoration:none;

    color:inherit;

    display:block;

    transition:0.25s;

    box-shadow:
    3px 5px 12px rgba(80,70,60,0.08);

}

.section:hover {

    transform:
    translateY(-5px)
    rotate(-1deg);

}
        
        .section .symbol {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .section h3 {
            margin: 0;
            font-size: 17px;
            font-weight: normal;
            letter-spacing: 3px;
        }

        .section p {
            margin-bottom: 0;
            font-size: 12px;
            color: #858078;
        }

/* 生活记录 */

.life {

    max-width:750px;

    margin:0 auto 70px;

}



.life-item {

    display:grid;

    grid-template-columns: 180px 1fr;

    gap:60px;

    padding:45px 0;

    border-bottom:1px solid #ddd4c4;

    align-items:start;

}

       .life-item:nth-child(even){

    grid-template-columns:1fr 180px;

}


.life-item:nth-child(even) .life-title{

    text-align:right;

} 

.life-title {

    font-size:24px;

    letter-spacing:5px;

    color:#596270;

    padding-top:5px;

}


.life-content h3 {

    font-size:20px;

    font-weight:normal;

    letter-spacing:3px;

    margin-top:0;

    margin-bottom:20px;

}



.life-content p {

    line-height:2;

    color:#59554e;

}



.life-content a {

    color:#596270;

    text-decoration:none;

}



.calendar-link {

    display:block;

    text-align:center;

    margin-top:50px;

    color:#596270;

    text-decoration:none;

    letter-spacing:4px;

}



@media(max-width:600px){

.life-item{

    grid-template-columns:1fr;

    gap:15px;

}

}
        
        /* 月相区域 */
        .moon-section {
            text-align: center;
            margin-bottom: 70px;
        }

        .moon-section h2 {
            font-size: 18px;
            font-weight: normal;
            letter-spacing: 4px;
        }

        .phases {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 18px;
}

        /* 底部 */
        footer {
            text-align: center;
            color: #858078;
            font-size: 13px;
            letter-spacing: 3px;
            line-height: 2;
        }

        /* 手机 */
        @media (max-width: 600px) {

            .notebook {
                padding: 45px 20px;
            }

            .moon-row {
                font-size: 17px;
                letter-spacing: 7px;
            }

            .title h1 {
                font-size: 30px;
                letter-spacing: 6px;
            }

            .title .moon {
                font-size: 34px;
            }

            .diary {
                padding: 28px 22px;
            }

            .sections {
                gap: 10px;
            }

            .section {
                padding: 20px 10px;
            }

            .phases {
                font-size: 19px;
                letter-spacing: 5px;
            }
        }
    </style>
</head>

<body>

<div class="notebook">

    <!-- 月相装饰 -->
<div class="moon-row">
    <span class="moon-phase new"></span>
    <span class="moon-phase crescent-right"></span>
    <span class="moon-phase quarter-right"></span>
    <span class="moon-phase gibbous-right"></span>
    <span class="moon-phase full"></span>
    <span class="moon-phase gibbous-left"></span>
    <span class="moon-phase quarter-left"></span>
    <span class="moon-phase crescent-left"></span>
</div>

    <!-- 标题 -->
  <header class="title">

    <div class="torii">
        <div class="torii-top"></div>
        <div class="torii-body"></div>
    </div>

    <div class="moon">☾</div>

    <h1>月見の庭</h1>

    <p>日々のことを、少しずつ。</p>

</header>


    <!-- 日期 -->
   <div class="date" id="today-date"></div>


<!-- 今日记录 -->

<section class="diary">

<h2>今日の記録</h2>


<textarea 
id="diary-text"
placeholder="今日は何をしましたか？&#10;今天发生了什么呢？">
</textarea>


<input
id="music-url"
placeholder="🎵 网易云音乐链接"
/>


<button id="save-btn">
保存今日
</button>


</section>

<!-- 生活记录 -->

<section class="life">


<div class="life-item">


<div class="life-title">

📖 日記

</div>


<div class="life-content">

<h3>今日のこと</h3>

<p id="today-preview">
今天还没有记录。
</p>

</div>

</div>





<div class="life-item">


<div class="life-content">

<h3>今聴いている音楽</h3>

<p>
今日喜欢的歌曲
</p>


<a href="#" target="_blank">

🎵 网易云音乐

</a>


</div>


<div class="life-title">

🎵 音楽

</div>


</div>





<div class="life-item">


<div class="life-title">

📷 写真

</div>


<div class="life-content">

<h3>最近の写真</h3>

<p>
以后这里放照片。
</p>


</div>


</div>






<div class="life-item">


<div class="life-content">

<h3>日本語の勉強</h3>

<p>
今日の日本語：
</p>

<p>
月がきれいですね。
</p>


</div>


<div class="life-title">

🇯🇵 日本語

</div>


</div>



<a href="calendar.html" class="calendar-link">

⛩️ 月の記録室

</a>



</section>
    <!-- 月相 -->
    <section class="moon-section">

        <h2>今月の月</h2>

<div class="phases">

    <span class="moon-phase new"></span>
    <span class="moon-phase crescent-right"></span>
    <span class="moon-phase quarter-right"></span>
    <span class="moon-phase gibbous-right"></span>
    <span class="moon-phase full"></span>
    <span class="moon-phase gibbous-left"></span>
    <span class="moon-phase quarter-left"></span>
    <span class="moon-phase crescent-left"></span>

</div>

    </section>


    <!-- 底部 -->
    <footer>

        「今日も、月がきれい。」

        <br>

        — 月見

    </footer>

</div>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://cnmsctwltdmfkgfhysqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_sxexZUH4aIZ0F6p3WwMY2Q_4JagOL24";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

document.addEventListener("DOMContentLoaded",async()=>{


// 获取今天日期

const now = new Date();

const today =
`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;



// 读取今天日记

const {data,error}=

await supabaseClient

.from("diary")

.select("*")

.eq("date",today)

.single();



if(data){


document.getElementById("diary-text").value =
data.content || "";


document.getElementById("music-url").value =
data.music || "";



document.getElementById("today-preview").textContent =
data.content || "今天还没有记录。";


}



document
.getElementById("save-btn")
.onclick = async function(){

const content =
document.getElementById("diary-text").value;


const music =
document.getElementById("music-url").value;


const now = new Date();

const today =
`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;


const {data,error}=

await supabaseClient

.from("diary")

.upsert(
[
{
date:today,

content:content,

music:music

}
],
{
onConflict:"date"
}
);


if(error){

alert("保存失败");

console.log(error);

}

else{

alert("今日の記録を保存しました 🌙");

}


};


});
    
    const today = new Date();

    const year = today.getFullYear();
    const month = today.getMonth() + 1;
    const day = today.getDate();

    const week = [
        "日曜日",
        "月曜日",
        "火曜日",
        "水曜日",
        "木曜日",
        "金曜日",
        "土曜日"
    ];

    const weekday = week[today.getDay()];

    document.getElementById("today-date").textContent =
        `${year}年 ${month}月 ${day}日　${weekday}`;
</script>
    
</body>
</html>
